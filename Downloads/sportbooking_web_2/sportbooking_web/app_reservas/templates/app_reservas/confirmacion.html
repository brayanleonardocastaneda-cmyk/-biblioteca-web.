{% extends 'base.html' %}
{% block titulo %}Reserva confirmada{% endblock %}

  <h1 style="font-size:24px;margin:6px 0">Reserva confirmada</h1>

  <div class="row" style="justify-content:center;margin-top:20px">

  </div>
</div>
{% endblock %}
